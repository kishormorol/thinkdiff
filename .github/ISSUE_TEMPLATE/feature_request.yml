name: Feature request
description: Suggest a new model, visualization, or metric
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
